name: build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      # Safe placeholders for build-time checks in CI.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      NEXTAUTH_SECRET: ci-placeholder-secret
      AUTH_SECRET: ci-placeholder-secret
      NEXTAUTH_URL: http://localhost:3000
      RESEND_API_KEY: ci-placeholder
      PAYSTACK_SECRET_KEY: ci-placeholder
      PAYSTACK_PUBLIC_KEY: ci-placeholder
      UPSTASH_REDIS_REST_URL: https://example.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder
      DO_SPACES_ENDPOINT: https://fra1.digitaloceanspaces.com
      DO_SPACES_REGION: fra1
      DO_SPACES_KEY: ci-placeholder
      DO_SPACES_SECRET: ci-placeholder
      DO_SPACES_BUCKET: ci-placeholder
      NEXT_PUBLIC_SANITY_PROJECT_ID: at8svyj2
      NEXT_PUBLIC_SANITY_DATASET: production
      # Expose Gitleaks license (if present) to the job as an env var so the
      # step conditional can reference it without using the `secrets` context
      # directly in an `if` expression (which can cause parsing errors).
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Trivy is installed here, not by the action's own installer
      # (aquasecurity/setup-trivy). That installer treats any non-200 reply as
      # a silent failure and never retries: on 2026-11-08, during a GitHub
      # incident with timeouts, three runs in a row failed at three different
      # points of it, each with only "exit code 1" in the log.
      #
      # Plain, unauthenticated requests on purpose. On 2026-11-08 a download
      # authenticated with the workflow token (gh release download) was
      # rejected from a GitHub-hosted runner with a 403: the aquasecurity
      # organisation has an IP allow list that does not include runner
      # addresses. The unauthenticated downloads the old installer made had
      # worked from runners. Do not "improve" this by adding a token.
      #
      # Each attempt downloads the archive and the checksums published with the
      # release and verifies one against the other, so a truncated or altered
      # download is retried and then fails the job; nothing is unpacked unless
      # it verified.
      #
      # The version is pinned. trivy-action is referenced at @master, whose
      # default Trivy version moves whenever they release, so it could change
      # this build with no commit here. Bump TRIVY_VERSION deliberately, in its
      # own commit, so a failure is traceable.
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.75.0
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/trivy-download"
          mkdir -p "$dir" "$HOME/.local/bin"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          checksums="trivy_${TRIVY_VERSION}_checksums.txt"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"

          fetch() {
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 5 \
              --connect-timeout 20 --max-time 300 \
              --output "$dir/$1" "$base/$1"
          }

          for attempt in 1 2 3 4 5; do
            # grep is anchored on the end of the line so the .deb and .rpm
            # entries for the same release cannot match.
            if fetch "$tarball" && fetch "$checksums" \
               && (cd "$dir" && grep " ${tarball}\$" "$checksums" | sha256sum -c -); then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Could not download and verify Trivy ${TRIVY_VERSION} after 5 attempts"
              exit 1
            fi
            echo "Download or verification failed (attempt ${attempt}), retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done

          tar -xzf "$dir/$tarball" -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trivy" --version

      # Two passes, deliberately. A HIGH in a transitive dependency often has
      # no same-day fix available, and blocking a release on one turns a report
      # into a false emergency. So HIGH is recorded and CRITICAL blocks.
      #
      # The second pass reuses the vulnerability DB the first one cached, so it
      # costs seconds rather than another 100MB download.
      - name: Dependency Audit (report)
        uses: aquasecurity/trivy-action@master
        with:
          skip-setup-trivy: true
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: .next

      - name: Upload audit results
        uses: github/codeql-action/upload-sarif@v3
        # Runs even when a later step fails, so findings are still recorded.
        # Non-blocking: code scanning upload needs GitHub Advanced Security on
        # a private repo, and a missing entitlement must not fail the build.
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Dependency Audit (block on critical)
        uses: aquasecurity/trivy-action@master
        with:
          skip-setup-trivy: true
          scan-type: fs
          scanners: vuln
          severity: CRITICAL
          exit-code: 1
          skip-dirs: .next

      - name: Run gitleaks
        if: ${{ env.GITLEAKS_LICENSE != '' }}
        uses: gitleaks/gitleaks-action@v2
        with:
          args: --path=.
        env:
          GITLEAKS_LICENSE: ${{ env.GITLEAKS_LICENSE }}

      - name: Static Security Scan (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/security-audit

      - name: Build
        run: pnpm build
