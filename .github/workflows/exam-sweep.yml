name: exam-sweep

# Auto-submits expired exam attempts, closes finished exams, and marks no-shows.
#
# This is a BACKSTOP, not the primary mechanism. A candidate sitting an exam has
# their own browser submit when the clock runs out; this catches the ones who
# closed the laptop, lost power, or walked away.
#
# GitHub's scheduled workflows are best-effort: runs are frequently delayed by
# 5-15 minutes and can be dropped entirely when the platform is busy. That is
# acceptable here precisely because the sweep is a backstop and every pass is
# idempotent — a late run does the same work, and a skipped run is picked up by
# the next one. Do not build anything that needs punctuality on top of this.

on:
  schedule:
    # Every 5 minutes is the finest granularity GitHub accepts.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# A slow run must never overlap with the next tick.
concurrency:
  group: exam-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the sweep endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set in repository secrets."
            exit 1
          fi

          response=$(mktemp)
          # --fail-with-body so a non-2xx still prints what the server said.
          status=$(curl -sS \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            --retry-connrefused \
            -o "$response" \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/exam-sweep")

          echo "HTTP $status"
          cat "$response"
          echo

          if [ "$status" != "200" ]; then
            exit 1
          fi
