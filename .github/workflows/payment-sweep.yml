name: payment-sweep

# Settles Paystack charges that were taken but never finalized, and marks
# abandoned checkouts as failed.
#
# This is a BACKSTOP, not the primary mechanism. Settlement normally happens on
# the Paystack callback and webhook; this catches the ones that slipped —
# browser closed mid-redirect, webhook lost, or settlement itself threw.
#
# Every pass is idempotent: finalize re-verifies with Paystack and returns
# early on an already-completed transaction. A late run does the same work and
# a skipped run is picked up by the next one.
#
# Runs less often than the exam sweep because a stranded payment is recovered
# by any pass, not by a punctual one. There is a 15 minute grace period in the
# sweep itself so a student still on the Paystack page is never touched.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# A slow run must never overlap with the next tick.
concurrency:
  group: payment-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the sweep endpoint
        env:
          # The site URL is not a secret — it is on every page we serve. It was
          # one, which meant two things to configure instead of one and a
          # failure mode where the secret was set and the URL silently was not.
          # Overridable for staging; the default is the canonical origin.
          #
          # It must be the host the apex redirects TO, www included. curl drops
          # the Authorization header when a redirect crosses hosts, so an apex
          # URL turns into a 401 that looks like a wrong secret.
          APP_URL: ${{ secrets.APP_URL || 'https://www.palmtechniq.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set in this repository's Actions secrets."
            echo
            echo "This is separate from the CRON_SECRET in the hosting"
            echo "environment. That one lets the endpoint VERIFY the request;"
            echo "this one lets the workflow SEND it. Both must hold the same"
            echo "value. Set it under Settings > Secrets and variables >"
            echo "Actions > Repository secrets — not Environments, and not the"
            echo "Variables tab."
            exit 1
          fi

          response=$(mktemp)
          status=$(curl -sS \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            --retry-connrefused \
            -o "$response" \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/payment-sweep")

          echo "HTTP $status"
          cat "$response"
          echo

          # A redirect is not followed on purpose. curl drops the Authorization
          # header when it crosses to a different host, so following one would
          # turn a config mistake into a silent 401. APP_URL must be the
          # canonical host — the one the apex redirects TO, www included.
          case "$status" in
            30*)
              echo "APP_URL points at a host that redirects. Set it to the"
              echo "canonical origin so the Authorization header survives."
              exit 1
              ;;
            401) echo "CRON_SECRET does not match the value in the hosting environment."; exit 1 ;;
            503) echo "CRON_SECRET is not set in the hosting environment."; exit 1 ;;
          esac

          if [ "$status" != "200" ]; then
            exit 1
          fi
